# Runs Locust INSIDE the cluster, so traffic goes through the Service and is
# spread across every pod. (port-forward would send it all to one pod.)
# Needs the workloads ConfigMap first -- see cloud-env/README.md.
#
# Normally started by cloud-env/run_experiment.py, which fills in WORKLOAD
# and RUN_ID. To run by hand, change WORKLOAD below: ramp.py, spike.py,
# periodic.py, bursty.py, step.py or smoke.py.
apiVersion: batch/v1
kind: Job
metadata:
  name: locust-run
spec:
  backoffLimit: 0  # a failed run should be looked at, not silently retried
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: locust
          image: locustio/locust:2.47.0
          env:
            - name: WORKLOAD
              value: ramp.py
            - name: RUN_ID  # names the CSV files in /data/results on the node
              value: manual
            - name: BURST_SEED  # only used by bursty.py
              value: "42"
          args: ["-f", "/mnt/locust/$(WORKLOAD)", "--headless", "--host", "http://scale-app",
                 "--print-stats", "--csv", "/results/$(RUN_ID)", "--csv-full-history"]
          securityContext:
            runAsUser: 0  # the results folder on the node is root-owned (local test cluster only)
          resources:
            requests:
              cpu: "1"  # so the load generator isn't the bottleneck
              memory: 256Mi
          volumeMounts:
            - name: workloads
              mountPath: /mnt/locust
            - name: results
              mountPath: /results
      volumes:
        - name: workloads
          configMap:
            name: workloads
        - name: results  # survives the pod; run_experiment.py copies it off with `minikube cp`
          hostPath:
            path: /data/results
            type: DirectoryOrCreate
