# Runs Locust INSIDE the cluster, so traffic goes through the Service and is
# spread across every pod. (port-forward would send it all to one pod.)
# Needs the workloads ConfigMap first -- see cloud-env/README.md.
#
# To pick a workload, change WORKLOAD below: ramp.py, spike.py, periodic.py,
# bursty.py or step.py.
apiVersion: batch/v1
kind: Job
metadata:
  name: locust-run
spec:
  backoffLimit: 0  # a failed run should be looked at, not silently retried
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: locust
          image: locustio/locust:2.47.0
          env:
            - name: WORKLOAD
              value: ramp.py
            - name: BURST_SEED  # only used by bursty.py
              value: "42"
          args: ["-f", "/mnt/locust/$(WORKLOAD)", "--headless", "--host", "http://scale-app", "--print-stats"]
          resources:
            requests:
              cpu: "1"  # so the load generator isn't the bottleneck
              memory: 256Mi
          volumeMounts:
            - name: workloads
              mountPath: /mnt/locust
      volumes:
        - name: workloads
          configMap:
            name: workloads
