# Kubernetes' standard Horizontal Pod Autoscaler on CPU.
#   target       60% average CPU utilization (relative to the 100m request)
#   replicas     1 to 10 (the shared bounds every controller uses)
#   behavior     Kubernetes defaults, written out so they're visible:
#                scale up: at most +100% or +4 pods per 15 s (whichever is more)
#                scale down: wait 5 min (use the highest recommendation from the
#                last 300 s), then at most -100% per 15 s
#                (plus the controller's built-in 10% tolerance and 15 s sync period)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: scale-app
  namespace: scale
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: scale-app
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 300
      selectPolicy: Max
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
